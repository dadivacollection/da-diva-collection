<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DA Diva Collection - Admin</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f6f2f4;font-family:Arial,sans-serif;color:#222}
.box{max-width:850px;margin:22px auto;padding:15px}
.panel{background:#fff;padding:22px;border-radius:16px;box-shadow:0 4px 18px #0001}
h1{color:#8d2452;margin-top:0}
label{display:block;font-weight:bold;margin-top:13px}
input,textarea{width:100%;padding:12px;margin-top:6px;border:1px solid #ddd;border-radius:9px;font-size:15px}
button{border:0;padding:11px 16px;border-radius:9px;cursor:pointer;margin-top:13px}
.primary{background:#8d2452;color:#fff}
.secondary{background:#eee}
.danger{background:#f4d9df;color:#7b153f}
.hidden{display:none}
.status{padding:10px;background:#f6edf1;border-radius:9px;margin:10px 0}
.item{display:flex;gap:12px;align-items:center;border-top:1px solid #eee;padding:13px 0}
.item img{width:70px;height:70px;object-fit:cover;border-radius:9px}
.grow{flex:1}.small{font-size:13px;color:#666}
.actions button{margin:2px;padding:8px 10px}
</style>
</head>
<body>
<div class="box"><div class="panel">
<h1>DA Diva Collection — Admin</h1>

<section id="loginBox">
<label>Email</label>
<input id="emailInput" type="email" autocomplete="username">
<label>Password</label>
<input id="passwordInput" type="password" autocomplete="current-password">
<button id="loginBtn" class="primary">Login</button>
<div id="loginMsg"></div>
</section>

<section id="app" class="hidden">
<div class="status">Logged in: <b id="userEmail"></b>
<button id="logoutBtn" class="secondary">Logout</button></div>

<h2 id="formTitle">Add Product</h2>
<form id="productForm">
<input id="editId" type="hidden">

<label>Product Name *</label>
<input id="productName" required>

<label>Price</label>
<input id="productPrice" placeholder="₹499">

<label>Category</label>
<input id="productCategory" placeholder="Jewellery / Fashion / Beauty">

<label>Description</label>
<textarea id="productDescription" rows="3"></textarea>

<label>Product Image</label>
<input id="productImage" type="file" accept="image/*">
<div id="currentImage" class="small"></div>

<label>Buy / Affiliate Link *</label>
<input id="buyLink" type="url" placeholder="https://..." required>

<button id="saveBtn" class="primary" type="submit">➕ Add Product</button>
<button id="clearBtn" class="secondary" type="button">Clear</button>
</form>

<h2>Products</h2>
<div id="productsList"></div>
</section>
</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://dhvjdzmdglpvlfaugyti.supabase.co";
const SUPABASE_KEY = "sb_publishable__LaL4b7mvou-w4w8LtKAog_53UF2TyM";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = (id) => document.getElementById(id);
let products = [];

async function init() {
  const result = await db.auth.getSession();
  if (result.data.session) {
    showApp(result.data.session.user);
  } else {
    $("loginBox").classList.remove("hidden");
  }
}

function showApp(user) {
  $("loginBox").classList.add("hidden");
  $("app").classList.remove("hidden");
  $("userEmail").textContent = user.email || "";
  loadProducts();
}

$("loginBtn").addEventListener("click", async () => {
  $("loginMsg").textContent = "Logging in...";
  const result = await db.auth.signInWithPassword({
    email: $("emailInput").value.trim(),
    password: $("passwordInput").value
  });
  if (result.error) {
    $("loginMsg").textContent = result.error.message;
  } else {
    $("loginMsg").textContent = "";
    showApp(result.data.user);
  }
});

$("logoutBtn").addEventListener("click", async () => {
  await db.auth.signOut();
  location.reload();
});

async function uploadImage(file) {
  if (!file) return null;

  const extension = (file.name.split(".").pop() || "jpg").toLowerCase();
  const path = crypto.randomUUID() + "." + extension;

  const result = await db.storage
    .from("product-images")
    .upload(path, file, {
      contentType: file.type,
      upsert: false
    });

  if (result.error) throw result.error;

  return db.storage
    .from("product-images")
    .getPublicUrl(path).data.publicUrl;
}

$("productForm").addEventListener("submit", async (event) => {
  event.preventDefault();

  const saveBtn = $("saveBtn");
  saveBtn.disabled = true;
  saveBtn.textContent = "Saving...";

  try {
    const editId = $("editId").value;
    let imageUrl = $("currentImage").dataset.url || null;

    const file = $("productImage").files[0];
    if (file) {
      imageUrl = await uploadImage(file);
    }

    const row = {
      name: $("productName").value.trim(),
      price: $("productPrice").value.trim(),
      category: $("productCategory").value.trim(),
      description: $("productDescription").value.trim(),
      image_url: imageUrl,
      buy_link: $("buyLink").value.trim(),
      is_active: true
    };

    if (!row.name) throw new Error("Product name is required.");
    if (!row.buy_link) throw new Error("Buy / Affiliate link is required.");

    let result;

    if (editId) {
      result = await db.from("products").update(row).eq("id", editId);
    } else {
      result = await db.from("products").insert(row);
    }

    if (result.error) throw result.error;

    alert(editId ? "Product updated!" : "Product added!");
    resetForm();
    await loadProducts();

  } catch (error) {
    console.error(error);
    alert(error.message || "Something went wrong.");
  } finally {
    saveBtn.disabled = false;
    saveBtn.textContent = $("editId").value ? "💾 Update Product" : "➕ Add Product";
  }
});

async function loadProducts() {
  const result = await db
    .from("products")
    .select("*")
    .order("created_at", {ascending:false});

  if (result.error) {
    $("productsList").innerHTML = "<p>" + escapeHtml(result.error.message) + "</p>";
    return;
  }

  products = result.data || [];
  renderProducts();
}

function renderProducts() {
  if (!products.length) {
    $("productsList").innerHTML = "<p class='small'>No products yet.</p>";
    return;
  }

  $("productsList").innerHTML = products.map(p => `
    <div class="item">
      <img src="${p.image_url || "https://via.placeholder.com/80?text=No+Image"}" alt="">
      <div class="grow">
        <b>${escapeHtml(p.name)}</b><br>
        <span class="small">${escapeHtml(p.price || "")} · ${escapeHtml(p.category || "")}</span>
      </div>
      <div class="actions">
        <button class="secondary" onclick="editProduct('${p.id}')">✏️ Edit</button>
        <button class="danger" onclick="deleteProduct('${p.id}')">🗑️ Delete</button>
      </div>
    </div>
  `).join("");
}

function editProduct(id) {
  const product = products.find(p => String(p.id) === String(id));
  if (!product) return;

  $("editId").value = product.id;
  $("productName").value = product.name || "";
  $("productPrice").value = product.price || "";
  $("productCategory").value = product.category || "";
  $("productDescription").value = product.description || "";
  $("buyLink").value = product.buy_link || "";
  $("currentImage").dataset.url = product.image_url || "";
  $("currentImage").textContent = product.image_url
    ? "Current image saved. Select another file to replace it."
    : "";

  $("formTitle").textContent = "Edit Product";
  $("saveBtn").textContent = "💾 Update Product";
  window.scrollTo({top:0, behavior:"smooth"});
}

async function deleteProduct(id) {
  if (!confirm("Delete this product?")) return;

  const result = await db.from("products").delete().eq("id", id);

  if (result.error) {
    alert(result.error.message);
  } else {
    await loadProducts();
  }
}

function resetForm() {
  $("productForm").reset();
  $("editId").value = "";
  $("currentImage").textContent = "";
  $("currentImage").dataset.url = "";
  $("formTitle").textContent = "Add Product";
  $("saveBtn").textContent = "➕ Add Product";
}

$("clearBtn").addEventListener("click", resetForm);

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, char => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[char]));
}

init();
</script>
</body>
</html>
