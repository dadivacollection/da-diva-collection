<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DA Diva Collection</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#faf7f8;color:#222}
header{background:linear-gradient(135deg,#721c46,#c94f82);color:#fff;text-align:center;padding:32px 16px}
.wrap{max-width:1100px;margin:auto;padding:22px 15px}.search{width:100%;padding:14px;border:1px solid #ddd;border-radius:12px;font-size:16px}
.cats{text-align:center;margin:15px 0}.cats button{border:0;padding:9px 14px;border-radius:20px;margin:4px;background:#f1dfe7}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}
.card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 3px 14px #0001}.card img{width:100%;height:240px;object-fit:cover}
.info{padding:15px}.price{font-size:20px;font-weight:bold;color:#9b2858}.buy{display:block;text-align:center;background:#9b2858;color:#fff;text-decoration:none;padding:11px;border-radius:10px;margin-top:12px}
.empty{text-align:center;padding:35px;color:#777}footer{text-align:center;background:#25141c;color:#fff;padding:25px;margin-top:30px}
</style></head><body>
<header><h1>DA Diva Collection</h1><p>Trendy Products • Easy Shopping</p></header>
<div class="wrap"><input id="search" class="search" placeholder="Search products..." oninput="render()"><div id="cats" class="cats"></div><div id="grid" class="grid"></div></div>
<footer>DA Diva Collection · Instagram: @DAdivacollection</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const db=supabase.createClient("https://dhvjdzmdglpvlfaugyti.supabase.co","sb_publishable__LaL4b7mvou-w4w8LtKAog_53UF2TyM");let products=[],active="All";
async function load(){const r=await db.from("products").select("*").eq("is_active",true).order("created_at",{ascending:false});if(r.error){grid.innerHTML="<div class='empty'>Products load nahi ho rahe.</div>";return}products=r.data||[];render()}
function render(){const q=search.value.toLowerCase();const cs=["All",...new Set(products.map(p=>p.category).filter(Boolean))];cats.innerHTML=cs.map(c=>`<button onclick='active=${JSON.stringify(c)};render()'>${c}</button>`).join("");
const a=products.filter(p=>(active=="All"||p.category==active)&&`${p.name} ${p.category||""} ${p.description||""}`.toLowerCase().includes(q));
grid.innerHTML=a.length?a.map(p=>`<div class="card"><img src="${p.image_url||"https://via.placeholder.com/700x500?text=DA+Diva"}"><div class="info"><h3>${esc(p.name)}</h3><div class="price">${esc(p.price||"")}</div><p>${esc(p.description||"")}</p><a class="buy" href="${esc(p.buy_link)}" target="_blank">Buy Now</a></div></div>`).join(""):"<div class='empty'>Abhi koi product available nahi hai.</div>"}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}load();
</script></body></html>
